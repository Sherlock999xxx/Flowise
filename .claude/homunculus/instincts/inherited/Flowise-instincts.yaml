# Flowise Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in each package.
2. Update the version numbers in package.json files for each affected package.
3. Update the main lockfile(s) (e.g., pnpm-lock.yaml, package-lock.json) to reflect new dependency versions.
4. Commit all changed package.json and lockfile(s) together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/*/package.json, packages/*/package-lock.json, pnpm-lock.yaml

